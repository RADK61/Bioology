            ["43","Ферзь (корм.)","223","А.В. Крохмаль и др.","3316/17 × 4007/16","","","","среднепоздний","лютесценс","Колос белый...","2024","3,4,5,7,8,9","Макс. 95,3 т/га","Зеленый корм"],
            ["44","Саур (яровая)","223/223","А.И. Грабовец и др.","отбор из мутантной популяции","9473","","","среднеспелый","эритроспермум","Колос остистый...","—","—","Белок 12,2-15,7%","Хлебопечение"]
        ];

        const sections = [
            { id: "gsi", name: "ГСИ (эталон)", icon: "fa-clipboard-list", desc: "8 сортов", type: "gsi" },
            { id: "s1", name: "Сорта без договоров", icon: "fa-file-contract", data: noContractsFullData, headers: ["Сорт","Ориг","Авторы","Родословная","Патент","Созревание","Разн.","Описание","Регионы","Достоинства","Назначение"], desc: "45 сортов" },
            { id: "s2", name: "Сорта тритикале", icon: "fa-wheat-awn", data: triticaleExtendedData, headers: ["№","Сорт","Ориг","Авторы","Родословная","Патент","Разн.","Описание","Регионы","Достоинства"], desc: "30 сортов" },
            { id: "s3", name: "Заявки", icon: "fa-file-signature", data: requestsData, headers: ["№","Сорт","Ориг","Авторы","Родословная","Разн.","Описание","Регионы","Достоинства"], desc: "4 заявки" },
            { id: "s4", name: "Организации", icon: "fa-building", data: orgsData, headers: ["Название","Код","Адрес"], desc: "2 организации" },
            { id: "s5", name: "Лицензионные сорта", icon: "fa-handshake", data: licensesData, headers: ["№","Сорт","Ориг","Авторы","Родословная","Патент","Всего","Действ","Созревание","Разн.","Описание","Год","Регионы","Достоинства","Назначение"], desc: "44 сорта" }
        ];

        // Утилиты
        function showToast(m) { const t=document.getElementById('toastMsg'); t.textContent=m; t.style.opacity='1'; setTimeout(()=>t.style.opacity='0',1500); }
        function escapeHtml(s) { if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        // Модальное окно
        const modalOverlay = document.getElementById('modalOverlay');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        document.getElementById('modalCloseBtn').addEventListener('click', ()=> modalOverlay.classList.remove('active'));
        modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) modalOverlay.classList.remove('active'); });

        function showModal(title, detailsObj) {
            modalTitle.textContent = title;
            let html = '<table class="detail-table">';
            for (let [k,v] of Object.entries(detailsObj)) {
                if (v === undefined || v === null) v = '—';
                html += `<tr><td>${escapeHtml(k)}</td><td>${escapeHtml(String(v))}</td></tr>`;
            }
            html += '</table>';
            modalBody.innerHTML = html;
            modalOverlay.classList.add('active');
        }

        // Рендер карточек (универсальный)
        function renderCardsPanel(container, headers, rows, placeholder, isGsi = false, gsiData = null) {
            container.innerHTML = `
                <div class="controls-panel">
                    <div class="search-section"><i class="fas fa-search"></i><input type="text" id="dataSearchInput" class="search-input" placeholder="${placeholder}"><button id="dataClearBtn" class="clear-btn"><i class="fas fa-times-circle"></i></button></div>
                    <div class="badge-count">🔍 Найдено: <span id="dataFoundCount">${rows.length}</span> / ${rows.length}</div>
                    <button id="exportDataCsv" class="export-btn"><i class="fas fa-download"></i> CSV</button>
                </div>
                <div class="chip-container" id="dataChips"></div>
                <div id="cardsGridContainer" class="card-grid"></div>
            `;
            const inp = document.getElementById('dataSearchInput');
            const clr = document.getElementById('dataClearBtn');
            const chipsDiv = document.getElementById('dataChips');
            const gridDiv = document.getElementById('cardsGridContainer');
            const foundSpan = document.getElementById('dataFoundCount');
            const expBtn = document.getElementById('exportDataCsv');

            const renderGrid = (filterText) => {
                const f = filterText.trim().toLowerCase();
                let filtered = rows;
                if (f) filtered = rows.filter(r => r.some(c => c && String(c).toLowerCase().includes(f)));
                foundSpan.textContent = filtered.length;
                chipsDiv.innerHTML = filtered.slice(0,20).map(r => `<div class="chip"><i class="fas fa-tag"></i> ${escapeHtml(r[1] || r[0])}</div>`).join('');
                if (!filtered.length) {
                    gridDiv.innerHTML = `<div class="no-results"><i class="fas fa-search"></i> Ничего не найдено</div>`;
                    return;
                }
                let cardsHtml = '';
                filtered.forEach(item => {
                    const name = item[1] || item[0] || '—';
                    cardsHtml += `<div class="variety-card" data-item='${JSON.stringify(item).replace(/'/g,"\\'")}' data-headers='${JSON.stringify(headers)}'>
                        <div class="card-img"><i class="fas fa-seedling"></i></div>
                        <div class="card-title">${escapeHtml(name)}</div>
                    </div>`;
                });
                gridDiv.innerHTML = cardsHtml;
                gridDiv.querySelectorAll('.variety-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const item = JSON.parse(card.dataset.item);
                        const hdrs = JSON.parse(card.dataset.headers);
                        const details = {};
                        hdrs.forEach((h,i) => { details[h] = item[i] || '—'; });
                        showModal(item[1] || item[0], details);
                    });
                });
            };
            inp.addEventListener('input', ()=> renderGrid(inp.value));
            clr.addEventListener('click', ()=>{ inp.value=''; renderGrid(''); });
            expBtn.addEventListener('click', ()=>{
                const f = inp.value.trim().toLowerCase();
                let filtered = rows;
                if(f) filtered = rows.filter(r => r.some(c => c && String(c).toLowerCase().includes(f)));
                const csv = [headers, ...filtered].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
                const blob = new Blob(["\uFEFF"+csv], {type:'text/csv'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'triticale_cards.csv';
                a.click();
                showToast('CSV экспортирован');
            });
            renderGrid('');
        }

        function renderGsiCards(container) {
            container.innerHTML = `<div class="controls-panel"><div class="search-section"><i class="fas fa-search"></i><input type="text" id="gsiSearch" class="search-input" placeholder="Поиск по ГСИ..."><button id="clearGsi" class="clear-btn"><i class="fas fa-times-circle"></i></button></div><div class="filter-buttons"><button data-type="all" class="filter-btn active">Все</button><button data-type="grain" class="filter-btn">Зерновые</button><button data-type="fodder" class="filter-btn">Кормовой</button></div><button id="exportGsiCsv" class="export-btn"><i class="fas fa-download"></i> CSV</button></div><div class="chip-container" id="gsiChips"></div><div id="gsiCardsGrid" class="card-grid"></div>`;
            // аналогично
            const search = document.getElementById('gsiSearch');
            const grid = document.getElementById('gsiCardsGrid');
            const chips = document.getElementById('gsiChips');
            const filterBtns = document.querySelectorAll('.filter-btn');
            let activeType = 'all';
            const update = () => {
                const f = search.value.trim().toLowerCase();
                let filtered = allGsiData.filter(s => activeType==='all' || s.type===activeType);
                if(f) filtered = filtered.filter(s => Object.values(s).some(v=>String(v).toLowerCase().includes(f)));
                chips.innerHTML = filtered.map(s=>`<div class="chip">${escapeHtml(s.sort)}</div>`).join('');
                grid.innerHTML = filtered.map(s=>`<div class="variety-card" data-gsi='${JSON.stringify(s).replace(/'/g,"\\'")}'>
                    <div class="card-img"><i class="fas fa-seedling"></i></div><div class="card-title">${escapeHtml(s.sort)}</div></div>`).join('');
                grid.querySelectorAll('.variety-card').forEach(c=> c.addEventListener('click', ()=>{
                    const s = JSON.parse(c.dataset.gsi);
                    showModal(s.sort, {
                        "Оригинатор": s.orig, "Авторы": s.authors, "Родословная": s.pedigree,
                        "Созревание": s.maturity, "Разновидность": s.variety, "Описание": s.description,
                        "Год": s.year, "Регионы": s.regions, "Достоинства": s.advantages, "Назначение": s.usage
                    });
                }));
            };
            search.addEventListener('input', update);
            document.getElementById('clearGsi').addEventListener('click', ()=>{ search.value=''; update(); });
            filterBtns.forEach(b=> b.addEventListener('click', ()=>{
                filterBtns.forEach(bb=>bb.classList.remove('active')); b.classList.add('active');
                activeType = b.dataset.type; update();
            }));
            document.getElementById('exportGsiCsv').addEventListener('click', ()=>{
                const csv = [['Сорт','Ориг','Авторы','Родословная','Год'], ...allGsiData.map(s=>[s.sort,s.orig,s.authors,s.pedigree,s.year])].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
                const b = new Blob(["\uFEFF"+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='gsi.csv'; a.click();
            });
            update();
        }

        // Управление вкладками
        let openTabs = [{ id: "root", label: "📂 Все разделы", icon: "fa-database", type: "root", closable: false }];
        let activeTabId = "root";

        function openTab(section) {
            if (section.id === 'gsi') {
                if (!openTabs.find(t=>t.type==='gsi')) openTabs.push({ id:'gsi_tab', label:'🌾 ГСИ', icon:'fa-clipboard', type:'gsi', closable:true });
                activeTabId = 'gsi_tab';
            } else {
                const existing = openTabs.find(t=>t.type==='data' && t.label.includes(section.name));
                if(existing) { activeTabId = existing.id; }
                else {
                    const newId = `data_${Date.now()}`;
                    openTabs.push({ id:newId, label:`📋 ${section.name}`, icon:section.icon, type:'data', closable:true, section:section });
                    activeTabId = newId;
                }
            }
            renderUI();
        }

        function closeTab(tabId, e) { e.stopPropagation(); if(tabId==='root') return; openTabs = openTabs.filter(t=>t.id!==tabId); if(activeTabId===tabId) activeTabId = openTabs[0].id; renderUI(); }

        function renderUI() {
            const tc = document.getElementById('tabContainer');
            tc.innerHTML = openTabs.map(t=>`<button class="tab-btn ${t.id===activeTabId?'active':''}" data-id="${t.id}"><i class="fas ${t.icon}"></i>${t.label} ${t.closable?`<span class="tab-close" data-close="${t.id}"><i class="fas fa-times-circle"></i></span>`:''}</button>`).join('');
            document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click', (e)=>{
                if(e.target.closest('.tab-close')) return;
                activeTabId = b.dataset.id; renderUI();
            }));
            document.querySelectorAll('.tab-close').forEach(s=>s.addEventListener('click', (e)=>closeTab(s.dataset.close, e)));
            const panels = document.getElementById('panelsContainer');
            const active = openTabs.find(t=>t.id===activeTabId);
            if (!active) return;
            if (active.type === 'root') {
                panels.innerHTML = `<div class="sections-grid">${sections.map(s=>`<div class="section-card" data-section='${s.id}'><div class="section-icon"><i class="fas ${s.icon}"></i></div><div class="section-title">${s.name}</div><div class="section-badge">${s.desc}</div></div>`).join('')}</div>`;
                document.querySelectorAll('.section-card').forEach(c=> c.addEventListener('click', ()=>{
                    const sec = sections.find(s=>s.id === c.dataset.section);
                    if(sec) openTab(sec);
                }));
            } else if (active.type === 'data') {
                const sec = active.section;
                renderCardsPanel(panels, sec.headers, sec.data, `Поиск по ${sec.name}...`);
            } else if (active.type === 'gsi') {
                renderGsiCards(panels);
            }
        }

        document.addEventListener('DOMContentLoaded', renderUI);
    })();
</script>
</body>
</html>
